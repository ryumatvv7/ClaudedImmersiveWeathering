plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	accessWidenerPath = file("src/main/resources/immersive_weathering.accesswidener")

	runs {
		server {
			// fail fast on broken mixins in the dev server (see ImmersiveWeathering#setup)
			property "iw.mixinAudit", "true"
			property "iw.selfTest", "true"
		}
	}

	mods {
		"immersive_weathering" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Moonlight Lib: used strictly as a binary dependency (public API only), never copied.
	implementation "maven.modrinth:moonlight:${project.moonlight_modrinth_id}"
}

processResources {
	def props = [
			version          : project.version,
			moonlight_version: project.moonlight_version,
			minecraft_version: project.minecraft_version,
			loader_version   : project.loader_version
	]
	inputs.properties props

	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
	it.options.compilerArgs += ["-Xmaxerrs", "20000", "-Xmaxwarns", "0", "-nowarn"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") { rename { "${it}_immersive_weathering" } }
	from("ATTRIBUTIONS") { rename { "${it}_immersive_weathering" } }
}

// Automated client tests (dev only, never shipped): creates a world, places the mod's blocks, takes
// screenshots, then starts a dedicated server and joins it. Run with: gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "immersive_weathering_test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
